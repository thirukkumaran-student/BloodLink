[project]
name = "bloodlink"
version = "1.0.0"
description = "BloodLink — hospital-centred blood coordination platform (Python / web-only build)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# Production geo stack (PostgreSQL + PostGIS). GeoAlchemy2 replaces the
# haversine adapter in bloodlink_api.core.geo when BLOODLINK_GEO_BACKEND=postgis.
prod = ["psycopg[binary]>=3.2", "geoalchemy2>=0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [
    "apps/api",
    "packages/config",
    "packages/contracts",
    "packages/validation",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI dependency-injection calls in defaults

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
